name: Release

on:
  push:
    tags:
      # '*' also matches '-', so 'v*' alone would match every tag below. Which package a tag
      # publishes is decided by scripts/release-package.mjs in the `package` job.
      - 'v*'          # CLI:        v1.2.3
      - 'sdk-v*'      # Live SDK:   sdk-v1.2.3
      - 'vod-v*'      # VOD CLI:    vod-v0.1.0
      - 'vod-sdk-v*'  # VOD SDK:    vod-sdk-v0.1.0

# Which package the pushed tag publishes. Every later job reads this instead of testing the
# tag itself; the workflow stops here for a tag that belongs to no package.
env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  package:
    name: Resolve the package to release
    runs-on: ubuntu-latest

    # Downstream jobs read the resolve step's results through the job's outputs; without this
    # mapping every needs.package.outputs.* is the empty string.
    outputs:
      PACKAGE_DIR: ${{ steps.pkg.outputs.PACKAGE_DIR }}
      PACKAGE_KEY: ${{ steps.pkg.outputs.PACKAGE_KEY }}
      PACKAGE_LABEL: ${{ steps.pkg.outputs.PACKAGE_LABEL }}
      PKG_NAME: ${{ steps.pkg.outputs.PKG_NAME }}
      PKG_VERSION: ${{ steps.pkg.outputs.PKG_VERSION }}
      INSTALL_COMMAND: ${{ steps.pkg.outputs.INSTALL_COMMAND }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Map the tag to a package
        id: pkg
        run: |
          node scripts/release-package.mjs resolve "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check that the tag version is the package's version
        run: |
          # The tag must agree with the committed package.json, or npm would be asked to
          # publish a version the repository does not record.
          DECLARED=$(node -p "require('./${{ steps.pkg.outputs.PACKAGE_DIR }}/package.json').version")
          if [ "$DECLARED" != "${{ steps.pkg.outputs.PKG_VERSION }}" ]; then
            echo "::error::tag $RELEASE_TAG says version ${{ steps.pkg.outputs.PKG_VERSION }} but ${{ steps.pkg.outputs.PACKAGE_DIR }}/package.json says $DECLARED"
            exit 1
          fi
          echo "Releasing ${{ steps.pkg.outputs.PKG_NAME }} $DECLARED from ${{ steps.pkg.outputs.PACKAGE_DIR }}"

  test:
    name: Test before release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Run tests
        # Only the package being released is tested, as before; the others are covered by CI.
        run: pnpm --filter "${{ needs.package.outputs.PKG_NAME }}" test:unit

  publish:
    name: Publish to npm
    needs: [package, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm trusted publishing (OIDC)，无需 NPM_TOKEN secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Verify package contents
        run: |
          cd "${{ needs.package.outputs.PACKAGE_DIR }}"
          echo "📦 Package: ${{ needs.package.outputs.PKG_NAME }}"
          echo "✅ Package ready for publish"

      # CLI 通过 workspace:* 引用 SDK，npm publish 无法解析 pnpm workspace 协议，
      # 发布前把依赖改写为 SDK 的实际版本（等价于 pnpm publish 的行为）
      - name: Resolve workspace dependency for CLI
        if: needs.package.outputs.PACKAGE_KEY == 'cli' || needs.package.outputs.PACKAGE_KEY == 'vod'
        run: |
          node -e "
            const fs = require('fs');
            const deps = {
              cli: ['packages/cli', 'polyv-live-api-sdk', 'packages/sdk'],
              vod: ['packages/vod-cli', 'polyv-vod-api-sdk', 'packages/vod-sdk']
            };
            const [cliDir, sdkName, sdkDir] = deps['${{ needs.package.outputs.PACKAGE_KEY }}'];
            const sdkVersion = require('./' + sdkDir + '/package.json').version;
            const p = './' + cliDir + '/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.dependencies[sdkName] = sdkVersion;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      # Trusted Publishing 要求 npm CLI >= 11.5.1；Node 24 自带版本可能不足，显式升级
      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          cd "${{ needs.package.outputs.PACKAGE_DIR }}"
          echo "📦 Publishing ${{ needs.package.outputs.PKG_NAME }} ${{ needs.package.outputs.PKG_VERSION }}..."
          npm publish --access public

  github-release:
    name: Create GitHub Release
    needs: [package, test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get tag version
        id: get_version
        run: |
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "CLEAN_VERSION=${{ needs.package.outputs.PKG_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "PACKAGE=${{ needs.package.outputs.PACKAGE_LABEL }}" >> "$GITHUB_OUTPUT"
          echo "PKG_NAME=${{ needs.package.outputs.PKG_NAME }}" >> "$GITHUB_OUTPUT"
          echo "INSTALL=${{ needs.package.outputs.INSTALL_COMMAND }}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog for this release
        id: changelog
        run: |
          # The previous tag of the same package: the tag before this one that starts with
          # this package's own prefix. (Other packages' tags, such as vod-v*, are skipped.)
          PACKAGE_PREFIX="${RELEASE_TAG%${{ needs.package.outputs.PKG_VERSION }}}"
          PREVIOUS_TAG=$(git tag --list "${PACKAGE_PREFIX}*" --sort=-v:refname --merged HEAD | grep -A1 -x "$RELEASE_TAG" | tail -n1)
          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "$RELEASE_TAG" ]; then
            # First release of this package: everything since the first commit.
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Changes since: $PREVIOUS_TAG"

          # Generate changelog
          echo "## 🚀 PolyV ${{ steps.get_version.outputs.PACKAGE }} ${{ steps.get_version.outputs.CLEAN_VERSION }}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 📋 Changes" >> release_notes.md
          echo "" >> release_notes.md

          git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..${{ steps.get_version.outputs.VERSION }} --no-merges | sed 's/fix:/🐛 Fixed:/g; s/feat:/✨ Added:/g; s/docs:/📚 Documentation:/g; s/test:/🧪 Tests:/g; s/chore:/🔧 Maintenance:/g; s/refactor:/♻️ Refactored:/g; s/perf:/⚡ Performance:/g' >> release_notes.md

          echo "" >> release_notes.md
          echo "### 📦 Installation" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo '${{ steps.get_version.outputs.INSTALL }}' >> release_notes.md
          echo '```' >> release_notes.md

          cat release_notes.md
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: PolyV ${{ steps.get_version.outputs.PACKAGE }} ${{ steps.get_version.outputs.CLEAN_VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false